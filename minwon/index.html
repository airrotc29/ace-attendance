<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#0f172a"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>민원 처리 공유 시스템</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#2563eb;--primary-dark:#1d4ed8;--primary-light:#eff6ff;
  --green:#059669;--green-light:#d1fae5;--red:#dc2626;--red-light:#fee2e2;
  --amber:#d97706;--amber-light:#fef3c7;--purple:#7c3aed;--purple-light:#ede9fe;
  --navy:#0f172a;--navy2:#1e293b;--gray1:#f8fafc;--gray2:#f1f5f9;--gray3:#e2e8f0;--gray4:#94a3b8;--gray5:#64748b;--gray6:#475569;
  --text:#0f172a;--radius:14px;--radius-sm:8px;--shadow:0 1px 3px rgba(0,0,0,.08),0 4px 14px rgba(0,0,0,.06);
  --nav-h:62px;--top-h:56px;
}
html,body{height:100%}
body{font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;background:var(--gray2);color:var(--text);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:14px}
button{cursor:pointer;border:none;background:none}
a{color:var(--primary)}
.hidden{display:none!important}

/* ══ 로그인 ══ */
.login-wrap{min-height:100vh;background:linear-gradient(145deg,#0f172a 0%,#1e3a8a 55%,#0369a1 100%);display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:#fff;border-radius:24px;padding:36px 28px;width:min(420px,96vw);box-shadow:0 24px 80px rgba(0,0,0,.4)}
.login-logo{text-align:center;margin-bottom:26px}
.login-logo .icon{font-size:50px;display:block;margin-bottom:8px}
.login-logo h1{font-size:22px;font-weight:800;color:var(--navy);letter-spacing:-.5px}
.login-logo p{font-size:13px;color:var(--gray5);margin-top:6px;line-height:1.5}
.login-box label{display:block;font-size:12px;font-weight:700;color:var(--gray6);margin:14px 0 6px}
.login-box select,.login-box input{width:100%;padding:13px 14px;border:2px solid var(--gray3);border-radius:12px;font-size:15px;background:#fff}
.login-box select:focus,.login-box input:focus{outline:none;border-color:var(--primary)}
.btn-login{width:100%;margin-top:22px;padding:15px;background:var(--primary);color:#fff;font-size:16px;font-weight:700;border-radius:12px}
.btn-login:disabled{background:var(--gray4)}
.login-hint{font-size:12px;color:var(--gray5);margin-top:16px;line-height:1.6;background:var(--gray1);padding:12px;border-radius:10px}

/* ══ 앱 공통 ══ */
#app{min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:50;height:var(--top-h);background:var(--navy);color:#fff;display:flex;align-items:center;padding:0 14px;gap:10px}
.topbar .tb-title{font-weight:800;font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .tb-title small{display:block;font-size:11px;font-weight:500;color:#94a3b8}
.topbar .tb-user{font-size:12px;text-align:right;line-height:1.3}
.topbar .tb-user b{display:block;font-size:13px}
.tb-btn{color:#fff;font-size:12px;padding:6px 10px;border-radius:8px;background:rgba(255,255,255,.12)}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--gray4);display:inline-block;margin-right:4px}
.sync-dot.on{background:#22c55e;box-shadow:0 0 6px #22c55e}
.sync-dot.off{background:#f59e0b}
.content{flex:1;padding:14px 14px calc(var(--nav-h) + 20px);max-width:760px;width:100%;margin:0 auto}
.bottomnav{position:fixed;bottom:0;left:0;right:0;height:var(--nav-h);background:#fff;border-top:1px solid var(--gray3);display:flex;z-index:50;padding-bottom:env(safe-area-inset-bottom)}
.bottomnav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--gray5);position:relative}
.bottomnav button .ni{font-size:21px}
.bottomnav button.active{color:var(--primary)}
.bottomnav .nbadge{position:absolute;top:6px;right:calc(50% - 22px);background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:10px;padding:1px 6px;min-width:18px;text-align:center}
.card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.card h3{font-size:15px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.sec-title{font-size:16px;font-weight:800;margin:4px 0 12px;display:flex;align-items:center;justify-content:space-between}
.sec-title small{font-size:12px;color:var(--gray5);font-weight:500}

/* ══ 폼 ══ */
.form-row{margin-bottom:12px}
.form-row label{display:block;font-size:12px;font-weight:700;color:var(--gray6);margin-bottom:6px}
.form-row label .req{color:var(--red)}
.form-row input,.form-row select,.form-row textarea{width:100%;padding:12px 13px;border:1.5px solid var(--gray3);border-radius:10px;font-size:15px;background:#fff}
.form-row textarea{min-height:90px;resize:vertical;line-height:1.5}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 12px;border-radius:20px;border:1.5px solid var(--gray3);background:#fff;font-size:12.5px;font-weight:600;color:var(--gray6);white-space:nowrap}
.chip.active{background:var(--primary);border-color:var(--primary);color:#fff}
.chip.red.active{background:var(--red);border-color:var(--red)}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.chips.scroll::-webkit-scrollbar{display:none}
.photo-add{display:flex;gap:8px;flex-wrap:wrap}
.photo-add .thumb{width:72px;height:72px;border-radius:10px;object-fit:cover;border:1px solid var(--gray3);position:relative}
.photo-add .thumb-wrap{position:relative}
.photo-add .thumb-del{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;width:20px;height:20px;border-radius:50%;font-size:12px;line-height:20px;text-align:center}
.photo-btn{width:72px;height:72px;border:2px dashed var(--gray4);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--gray5);gap:2px;cursor:pointer}
.photo-btn span{font-size:22px}
.btn{padding:12px 16px;border-radius:10px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:.15s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--primary);color:#fff}
.btn-green{background:var(--green);color:#fff}
.btn-amber{background:var(--amber);color:#fff}
.btn-red{background:var(--red);color:#fff}
.btn-gray{background:var(--gray2);color:var(--gray6);border:1px solid var(--gray3)}
.btn-block{width:100%}
.btn-sm{padding:8px 12px;font-size:12.5px;border-radius:8px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-row .btn{flex:1}

/* ══ 민원 카드 ══ */
.issue{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:10px;cursor:pointer;border-left:5px solid var(--gray4);transition:.15s}
.issue:active{transform:scale(.99)}
.issue.s-open{border-left-color:var(--red)}
.issue.s-progress{border-left-color:var(--amber)}
.issue.s-done{border-left-color:var(--green);opacity:.85}
.issue .i-head{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.issue .i-title{font-size:15px;font-weight:700;line-height:1.35;margin-bottom:4px}
.issue .i-meta{font-size:12px;color:var(--gray5);display:flex;flex-wrap:wrap;gap:4px 10px}
.issue .i-body{display:flex;gap:10px}
.issue .i-body > div{flex:1;min-width:0}
.issue .i-photo{width:64px;height:64px;border-radius:8px;object-fit:cover;flex-shrink:0}
.issue .i-foot{margin-top:8px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--gray6);flex-wrap:wrap}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;line-height:1.4}
.b-open{background:var(--red-light);color:var(--red)}
.b-progress{background:var(--amber-light);color:var(--amber)}
.b-done{background:var(--green-light);color:var(--green)}
.b-cat{background:var(--gray2);color:var(--gray6)}
.b-urgent{background:var(--red);color:#fff}
.b-team{background:var(--primary-light);color:var(--primary-dark)}
.b-none{background:var(--gray2);color:var(--gray4);border:1px dashed var(--gray4)}
.b-me{background:var(--purple-light);color:var(--purple)}
.empty{text-align:center;color:var(--gray4);padding:50px 20px;font-size:14px;line-height:1.7}
.empty .big{font-size:40px;display:block;margin-bottom:8px}
.summary-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat-tile{background:#fff;border-radius:12px;padding:12px 8px;text-align:center;box-shadow:var(--shadow)}
.stat-tile .n{font-size:22px;font-weight:800;line-height:1.1}
.stat-tile .l{font-size:11px;color:var(--gray5);margin-top:4px;font-weight:600}
.stat-tile.red .n{color:var(--red)}.stat-tile.amber .n{color:var(--amber)}.stat-tile.green .n{color:var(--green)}.stat-tile.blue .n{color:var(--primary)}

/* ══ 모달 ══ */
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
@media(min-width:640px){.modal-bg{align-items:center}}
.modal{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 18px 28px;animation:up .2s}
@media(min-width:640px){.modal{border-radius:20px}}
.modal-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.modal-head h2{font-size:17px;font-weight:800;flex:1;line-height:1.4}
.modal-close{font-size:22px;color:var(--gray4);padding:0 4px}
.detail-meta{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px;margin:12px 0;background:var(--gray1);padding:12px;border-radius:10px}
.detail-meta dt{color:var(--gray5);font-weight:600;white-space:nowrap}
.detail-meta dd{font-weight:500;word-break:break-all}
.detail-content{font-size:14.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word;padding:4px 2px}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.photos img{width:calc(33.33% - 6px);aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid var(--gray3);cursor:pointer}
.timeline{margin-top:14px;border-top:1px solid var(--gray3);padding-top:12px}
.timeline h4{font-size:13px;font-weight:800;color:var(--gray6);margin-bottom:10px}
.tl-item{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--gray3)}
.tl-item:last-child{border-bottom:none}
.tl-ic{width:30px;height:30px;border-radius:50%;background:var(--gray2);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.tl-ic.done{background:var(--green-light)}.tl-ic.assign{background:var(--primary-light)}.tl-ic.progress{background:var(--amber-light)}.tl-ic.reopen{background:var(--red-light)}
.tl-body{flex:1;min-width:0}
.tl-body .who{font-size:12.5px;font-weight:700}
.tl-body .who span{font-weight:500;color:var(--gray4);margin-left:6px;font-size:11.5px}
.tl-body .txt{font-size:13.5px;line-height:1.5;white-space:pre-wrap;margin-top:2px}
.tl-body img{max-width:140px;border-radius:8px;margin-top:6px;border:1px solid var(--gray3);cursor:pointer;display:block}
.action-bar{position:sticky;bottom:-28px;background:#fff;padding:12px 0 0;margin-top:14px;border-top:1px solid var(--gray3)}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:200;display:flex;align-items:center;justify-content:center}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}

/* ══ 채팅 ══ */
.chat-wrap{display:flex;flex-direction:column;height:calc(100vh - var(--top-h) - var(--nav-h));max-width:760px;margin:0 auto}
.chat-list{flex:1;overflow-y:auto;padding:14px 14px 8px;display:flex;flex-direction:column;gap:8px}
.msg{display:flex;flex-direction:column;max-width:82%;align-self:flex-start}
.msg.mine{align-self:flex-end;align-items:flex-end}
.msg .m-who{font-size:11.5px;color:var(--gray5);margin:0 4px 3px;font-weight:600}
.msg .m-bubble{background:#fff;padding:9px 13px;border-radius:16px;border-top-left-radius:4px;font-size:14px;line-height:1.5;box-shadow:var(--shadow);white-space:pre-wrap;word-break:break-word}
.msg.mine .m-bubble{background:#fef08a;border-top-left-radius:16px;border-top-right-radius:4px}
.msg .m-bubble img{max-width:220px;border-radius:10px;display:block;cursor:pointer}
.msg .m-time{font-size:10.5px;color:var(--gray4);margin:3px 4px 0}
.msg.notice .m-bubble{background:var(--amber-light);border:1px solid #fcd34d;font-weight:600}
.msg.sys{align-self:center;max-width:92%}
.msg.sys .m-bubble{background:rgba(15,23,42,.07);box-shadow:none;font-size:12.5px;color:var(--gray6);text-align:center;border-radius:12px;cursor:pointer}
.chat-date{align-self:center;font-size:11px;color:var(--gray5);background:rgba(15,23,42,.08);padding:3px 12px;border-radius:12px;margin:6px 0}
.chat-input{background:#fff;border-top:1px solid var(--gray3);padding:8px 10px;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
.chat-quick{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.chat-quick::-webkit-scrollbar{display:none}
.chat-quick button{white-space:nowrap;padding:6px 11px;border-radius:16px;background:var(--gray2);font-size:12px;font-weight:600;color:var(--gray6);border:1px solid var(--gray3)}
.chat-row{display:flex;gap:6px;align-items:flex-end}
.chat-row textarea{flex:1;border:1.5px solid var(--gray3);border-radius:18px;padding:10px 14px;font-size:15px;max-height:120px;min-height:42px;resize:none;line-height:1.4}
.chat-row textarea:focus{outline:none;border-color:var(--primary)}
.chat-row .ic-btn{width:42px;height:42px;border-radius:50%;font-size:20px;display:flex;align-items:center;justify-content:center;background:var(--gray2);color:var(--gray6)}
.chat-row .send{background:var(--primary);color:#fff;font-size:17px}
.chat-pending{display:flex;gap:6px;padding:0 0 8px}
.chat-pending img{height:54px;border-radius:8px;border:1px solid var(--gray3)}

/* ══ 통계 ══ */
.bar-list{display:flex;flex-direction:column;gap:7px}
.bar-row{display:grid;grid-template-columns:76px 1fr 38px;align-items:center;gap:8px;font-size:12.5px}
.bar-row .bl{font-weight:600;color:var(--gray6);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .bar{height:18px;background:var(--gray2);border-radius:6px;overflow:hidden}
.bar-row .bar > div{height:100%;background:var(--primary);border-radius:6px;min-width:2px}
.bar-row .bar > div.g{background:var(--green)}
.bar-row .bn{font-weight:700;text-align:right}
.month-nav{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:12px}
.month-nav b{font-size:17px}
.month-nav button{font-size:18px;padding:4px 12px;border-radius:8px;background:#fff;box-shadow:var(--shadow)}
table.rep{width:100%;border-collapse:collapse;font-size:12.5px}
table.rep th,table.rep td{border:1px solid var(--gray3);padding:6px 7px;text-align:left;vertical-align:top}
table.rep th{background:var(--gray2);font-weight:700;white-space:nowrap}
.repeat-item{padding:10px 0;border-bottom:1px dashed var(--gray3);font-size:13.5px}
.repeat-item:last-child{border-bottom:none}
.repeat-item b{color:var(--red)}
.repeat-item small{display:block;color:var(--gray5);font-size:12px;margin-top:2px}

/* ══ 검색 ══ */
.search-box{display:flex;gap:6px;margin-bottom:10px}
.search-box input{flex:1;padding:12px 14px;border:1.5px solid var(--gray3);border-radius:12px;font-size:15px}
.search-box input:focus{outline:none;border-color:var(--primary)}
mark{background:#fef08a;padding:0 2px;border-radius:3px}

/* ══ 토스트 ══ */
#toast{position:fixed;bottom:calc(var(--nav-h) + 16px);left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:600;opacity:0;transition:.25s;z-index:300;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}

/* ══ 인쇄 ══ */
@media print{
  body{background:#fff}
  .topbar,.bottomnav,#toast,.no-print{display:none!important}
  .content{padding:0;max-width:none}
  .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
  .print-only{display:block!important}
}
.print-only{display:none}
</style>
</head>
<body>

<!-- ══ 로그인 ══ -->
<div id="login" class="login-wrap">
  <div class="login-box">
    <div class="login-logo">
      <span class="icon">📋</span>
      <h1>민원 처리 공유 시스템</h1>
      <p>접수 · 담당 지정 · 처리 보고 · 채팅 · 월간 통계<br>직원 누구나 올리고, 모두가 함께 확인합니다</p>
    </div>
    <label>사업소</label>
    <select id="lg-office"></select>
    <label>이름</label>
    <select id="lg-emp"><option value="">-- 사업소를 먼저 선택 --</option></select>
    <button class="btn-login" id="lg-btn" onclick="doLogin()" disabled>입장하기</button>
    <div class="login-hint">💡 이름이 없으면 사업소 담당자에게 직원 등록을 요청하세요.<br>
    한 번 입장하면 이 기기에서는 자동으로 다시 입장됩니다.</div>
  </div>
</div>

<!-- ══ 앱 ══ -->
<div id="app" class="hidden">
  <div class="topbar">
    <div class="tb-title"><span id="tb-office"></span><small><span class="sync-dot" id="sync-dot"></span><span id="sync-text">연결 중…</span></small></div>
    <div class="tb-user"><b id="tb-name"></b><span id="tb-team"></span></div>
    <button class="tb-btn" onclick="logout()">나가기</button>
  </div>
  <div class="content" id="content"></div>
  <div class="bottomnav">
    <button data-tab="list" onclick="go('list')"><span class="ni">📋</span>민원<span class="nbadge hidden" id="nb-list"></span></button>
    <button data-tab="new" onclick="go('new')"><span class="ni">➕</span>접수</button>
    <button data-tab="chat" onclick="go('chat')"><span class="ni">💬</span>채팅<span class="nbadge hidden" id="nb-chat"></span></button>
    <button data-tab="stats" onclick="go('stats')"><span class="ni">📊</span>통계</button>
    <button data-tab="search" onclick="go('search')"><span class="ni">🔍</span>검색</button>
  </div>
</div>

<div id="modal-root"></div>
<div id="toast"></div>
<input type="file" id="file-input" accept="image/*" multiple class="hidden"/>

<script>
// ══════════════════════════════════════════════

// 사진 압축 (최대 1000px, JPEG)
function compressImage(file, max=1000, q=0.72){
  return new Promise(res=>{
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{
      let {width:w,height:h}=img; const r=Math.min(1,max/Math.max(w,h)); w=Math.round(w*r); h=Math.round(h*r);
      const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',q));
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); res(null); };
    img.src=url;
  });
}
function pickPhotos(cb){
  const inp=$('#file-input'); inp.value='';
  inp.onchange=async()=>{ const out=[]; for(const f of inp.files){ const d=await compressImage(f); if(d) out.push(d); } cb(out); };
  inp.click();
}

function sendChat(msg){
  msg.id = msg.id||uid(); msg.ts = msg.ts||Date.now();
  chat[msg.id]=msg; lsSet(K.chat(), pruneChat(chat)); lsSet(K.seenChat(), msg.ts); render();
  if(!sbOn){ queue('chat',msg.id); return; }
  sb.from('mw_chat').upsert(msgToRow(msg)).then(({error})=>{ if(error){ console.warn(error); queue('chat',msg.id); toast('⚠️ 서버 전송 실패 · 재연결 시 자동 전송'); } });
}
async function flushPending(){
  const p=pending(); const left={issues:{},chat:{},del:{}};
  for(const id of Object.keys(p.issues)){ const it=issues[id]; if(!it) continue; const {error}=await sb.from('mw_issues').upsert(issueToRow(it)); if(error) left.issues[id]=true; }
  for(const id of Object.keys(p.chat)){ const m=chat[id]; if(!m) continue; const {error}=await sb.from('mw_chat').upsert(msgToRow(m)); if(error) left.chat[id]=true; }
  for(const id of Object.keys(p.del)){ const {error}=await sb.from('mw_issues').delete().eq('id',id); if(error) left.del[id]=true; }
  lsSet(K.pending(),left);
}
function pruneChat(c){ const arr=Object.values(c).sort((a,b)=>a.ts-b.ts); const keep=arr.slice(-400); const o={}; keep.forEach(m=>o[m.id]=m); return o; }

// ── 사진 업로드 (Storage) : 실패 시 data URL 그대로 저장 ──
function dataUrlToBlob(d){ const [h,b]=d.split(','); const mime=(h.match(/data:(.*?);/)||[])[1]||'image/jpeg'; const bin=atob(b); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return new Blob([u],{type:mime}); }
async function uploadPhotos(dataUrls){
  const out=[];
  for(const d of dataUrls){
    if(!d || !d.startsWith('data:') || !sbOn){ out.push(d); continue; }
    try{
      const path=`${me.officeId}/${fmtDate(Date.now())}/${uid()}.jpg`;
      const {error}=await sb.storage.from(PHOTO_BUCKET).upload(path, dataUrlToBlob(d), {contentType:'image/jpeg', upsert:false});
      if(error) throw error;
      out.push(sb.storage.from(PHOTO_BUCKET).getPublicUrl(path).data.publicUrl);
    }catch(e){ console.warn('photo upload', e); out.push(d); }
  }
  return out;
}

function loadScript(src){ return new Promise((res,rej)=>{ if(window.supabase) return res(); const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('script load fail')); document.head.appendChild(s); }); }
async function connectSupabase(){
  setSync('off','기기 저장 모드 (오프라인)');
  try{
    await loadScript(SUPABASE_JS);
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON, { realtime:{ params:{ eventsPerSecond:10 } } });
    sbOn = true;
    await fetchAll();
    setSync('on','서버 연결됨');
    subscribeRealtime();
  }catch(e){
    console.warn('Supabase 연결 실패 → 기기 저장 모드', e);
    sbOn=false; setSync('off','기기 저장 모드 (서버 연결 안 됨)');
  }
}
function setSync(state,text){ const d=$('#sync-dot'); d.className='sync-dot '+state; $('#sync-text').textContent=text; }

let fetching=false;
async function fetchAll(){
  if(fetching) return; fetching=true;
  try{
  if(sb) await flushPending().catch(console.warn);
  const [ri, rc] = await Promise.all([
    sb.from('mw_issues').select('*').eq('office_id', me.officeId).order('created_at',{ascending:false}).limit(2000),
    sb.from('mw_chat').select('*').eq('office_id', me.officeId).order('ts',{ascending:false}).limit(400)
  ]);
  if(ri.error) throw ri.error; if(rc.error) throw rc.error;
  const prev = issues; const prevChatN = Object.keys(chat).length;
  const ni={}; ri.data.forEach(r=>ni[r.id]=rowToIssue(r));
  const nc={}; rc.data.forEach(r=>nc[r.id]=rowToMsg(r));
  // 아직 전송 못 한 대기열 항목은 로컬 버전 유지
  const p=pending(); Object.keys(p.issues).forEach(id=>{ if(issues[id]) ni[id]=issues[id]; }); Object.keys(p.chat).forEach(id=>{ if(chat[id]) nc[id]=chat[id]; });
  issues = ni; chat = nc;
  lsSet(K.issues(), issues); lsSet(K.chat(), pruneChat(chat));
  notifyNewAssignments(prev, issues);
  if(Object.keys(chat).length>prevChatN){ const last=Object.values(chat).sort((a,b)=>b.ts-a.ts)[0]; if(last && last.ts>lsGet(K.seenChat(),0)) notifyNewChat(last); }
  render();
  } finally { fetching=false; }
}
// 실시간(WebSocket)이 막힌 환경을 위한 폴링 대체 + 화면 복귀 시 새로고침
let pollTimer=null, realtimeOk=false;
function setPolling(on){
  if(on && pollTimer) return;            // 이미 폴링 중이면 타이머 유지 (채널 재시도마다 리셋 방지)
  clearInterval(pollTimer); pollTimer=null;
  if(on) pollTimer=setInterval(()=>{ if(document.visibilityState==='visible') fetchAll().catch(e=>{ console.warn(e); setSync('off','서버 연결 안 됨 · 기기 저장 모드'); }); }, 8000);
}
setInterval(()=>{ if(sbOn && realtimeOk && document.visibilityState==='visible') fetchAll().catch(console.warn); }, 90000);
function subscribeRealtime(){
  if(sbChannel){ try{ sb.removeChannel(sbChannel); }catch{} }
  sbChannel = sb.channel('mw-'+me.officeId)
    .on('postgres_changes',{event:'*',schema:'public',table:'mw_issues',filter:`office_id=eq.${me.officeId}`}, p=>{
      const prev={...issues};
      if(p.eventType==='DELETE'){ delete issues[p.old.id]; }
      else { const it=rowToIssue(p.new); if(!issues[it.id] || (it.updatedAt||0)>=(issues[it.id].updatedAt||0)) issues[it.id]=it; }
      lsSet(K.issues(), issues); notifyNewAssignments(prev, issues); render();
    })
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'mw_chat',filter:`office_id=eq.${me.officeId}`}, p=>{
      const m=rowToMsg(p.new); const isNew=!chat[m.id]; chat[m.id]=m; lsSet(K.chat(), pruneChat(chat));
      if(isNew) notifyNewChat(m); render();
    })
    .on('postgres_changes',{event:'DELETE',schema:'public',table:'mw_chat'}, p=>{ if(p.old&&chat[p.old.id]){ delete chat[p.old.id]; render(); } })
    .subscribe(status=>{
      if(status==='SUBSCRIBED'){ realtimeOk=true; setPolling(false); setSync('on','실시간 연결됨'); fetchAll().catch(console.warn); }
      else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'||status==='CLOSED'){ realtimeOk=false; if(sbOn){ setSync('on','서버 연결됨 · 8초마다 자동 새로고침'); setPolling(true); } }
    });
  // 실시간 채널이 몇 초 안에 붙지 않으면 우선 폴링으로 시작
  setTimeout(()=>{ if(!realtimeOk && sbOn){ setSync('on','서버 연결됨 · 8초마다 자동 새로고침'); setPolling(true); } }, 6000);
}

// 새 담당 지정 알림 (내 이름 또는 내 팀)
let notifInit=false;
function notifyNewAssignments(prev, cur){
  if(!notifInit){ notifInit=true; return; }
  Object.values(cur).forEach(it=>{
    const p = prev[it.id];
    if(isMine(it) && (!p || !isMine(p)) && it.status!=='done' && (it.assignedBy||'')!==me.empId){
      toast(`🔔 새 담당 민원: ${it.title}`, 4000); notify('새 담당 민원', it.title); vibrate();
    }
  });
}
function notifyNewChat(last){
  if(tab==='chat' && document.visibilityState==='visible'){ lsSet(K.seenChat(), Date.now()); return; }
  if(last && last.by && last.by.empId!==me.empId && last.kind!=='sys'){ notify('💬 '+last.by.name, last.text||'(사진)'); }
}
function notify(title, body){ try{ if('Notification' in window && Notification.permission==='granted' && document.visibilityState!=='visible') new Notification(title,{body}); }catch{} }
function vibrate(){ try{ navigator.vibrate && navigator.vibrate([120,60,120]); }catch{} }
function isMine(it){ const a=it.assignee||{}; return (a.type==='person'&&a.empId===me.empId)||(a.type==='team'&&a.name===me.team); }

function monthRange(ym){ const [y,m]=ym.split('-').map(Number); return [new Date(y,m-1,1).getTime(), new Date(y,m,1).getTime()]; }
function shiftMonth(n){ const [y,m]=statMonth.split('-').map(Number); const d=new Date(y,m-1+n,1); statMonth=`${d.getFullYear()}-${pad(d.getMonth()+1)}`; render(); }
function monthStats(ym){
  const [s,e]=monthRange(ym); const all=Object.values(issues);
  const recv=all.filter(i=>i.createdAt>=s&&i.createdAt<e);
  const done=all.filter(i=>i.status==='done'&&i.doneAt>=s&&i.doneAt<e);
  const open=all.filter(i=>i.createdAt<e&&i.status!=='done');
  const durs=done.map(i=>i.doneAt-i.createdAt).filter(x=>x>0);
  const avg=durs.length?durs.reduce((a,b)=>a+b,0)/durs.length:0;
  const by=(arr,f)=>{ const o={}; arr.forEach(i=>{ const k=f(i)||'기타'; o[k]=(o[k]||0)+1; }); return Object.entries(o).sort((a,b)=>b[1]-a[1]); };
  const sameDay=done.filter(i=>i.doneAt-i.createdAt<86400000).length;
  return { recv, done, open, avg, sameDay,
    byCat: by(recv,i=>i.category), bySrc: by(recv,i=>i.source),
    byTeam: by(recv.filter(i=>i.assignee&&i.assignee.type!=='none'),i=>i.assignee.type==='team'?i.assignee.name:(i.assignee.team||'개인')),
    byPerson: by(done,i=>i.assignee&&i.assignee.type==='person'?i.assignee.name:(i.assignee&&i.assignee.name)||'미지정'),
    urgent: recv.filter(i=>i.urgent).length };
}
function repeatIssues(days=180){
  const since=Date.now()-days*86400000; const all=Object.values(issues).filter(i=>i.createdAt>=since);
  const norm=s=>String(s||'').replace(/\s+/g,'').toLowerCase();
  const groups={};
  all.forEach(i=>{ const key=(norm(i.location)||'?')+'|'+(i.category||''); (groups[key]=groups[key]||[]).push(i); });
  // 장소가 없으면 제목 앞 6글자로 묶기
  all.filter(i=>!norm(i.location)).forEach(i=>{ const key='t|'+norm(i.title).slice(0,6)+'|'+(i.category||''); (groups[key]=groups[key]||[]).push(i); });
  const out=Object.values(groups).filter(g=>g.length>=2 || g.some(i=>i.reopened)).map(g=>({items:g.sort((a,b)=>b.createdAt-a.createdAt),count:g.length+g.reduce((a,i)=>a+(i.reopened||0),0)}));
  const seen=new Set(); return out.filter(g=>{ const k=g.items.map(i=>i.id).join(); if(seen.has(k))return false; seen.add(k); return true; }).sort((a,b)=>b.count-a.count);
}
function bars(entries,cls=''){ const mx=Math.max(1,...entries.map(e=>e[1])); return entries.length?`<div class="bar-list">${entries.map(([k,v])=>`<div class="bar-row"><div class="bl" title="${esc(k)}">${esc(k)}</div><div class="bar"><div class="${cls}" style="width:${v/mx*100}%"></div></div><div class="bn">${v}</div></div>`).join('')}</div>`:'<div style="color:var(--gray4);font-size:13px">자료 없음</div>'; }

function exportExcel(){
  if(typeof XLSX==='undefined'){ toast('엑셀 모듈을 불러오지 못했습니다 (인터넷 확인)'); return; }
  const st=monthStats(statMonth);
  const rows=st.recv.sort((a,b)=>a.createdAt-b.createdAt).map((i,n)=>({'번호':n+1,'접수일시':fmtDT(i.createdAt),'내용':i.title,'상세':i.content,'장소':i.location,'분류':i.category,'접수경로':i.source,'긴급':i.urgent?'Y':'','접수자':i.reporter?.name||'','담당':i.assignee?.name||'미지정','상태':STATUS[i.status],'완료일시':i.doneAt?fmtDT(i.doneAt):'','소요시간':i.doneAt?dur(i.doneAt-i.createdAt):'','처리과정':(i.logs||[]).filter(l=>l.type!=='create').map(l=>`[${fmtKo(l.ts)} ${l.by?.name}] ${l.text||'(사진)'}`).join('\n')}));
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), `${statMonth} 민원내역`);
  const sum=[['항목','값'],['접수',st.recv.length],['완료',st.done.length],['미완료 누적',st.open.length],['평균 처리시간',dur(st.avg)],['긴급',st.urgent],[],['분류','건수'],...st.byCat,[],['담당 팀','건수'],...st.byTeam,[],['처리자','완료 건수'],...st.byPerson];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(sum), '요약');
  XLSX.writeFile(wb, `${me.officeName}_민원처리_${statMonth}.xlsx`);
}

// ── 검색 ─────────────────────────────────────
let searchQ=''; let searchFrom=''; let searchTo='';
function renderSearch(){
  const q=searchQ.trim().toLowerCase(); const terms=q.split(/\s+/).filter(Boolean);
  let res=[];
  if(terms.length||searchFrom||searchTo){
    res=Object.values(issues).filter(i=>{
      if(searchFrom && fmtDate(i.createdAt)<searchFrom) return false;
      if(searchTo && fmtDate(i.createdAt)>searchTo) return false;
      const hay=[i.title,i.content,i.location,i.category,i.reporter?.name,i.assignee?.name,...(i.logs||[]).map(l=>l.text+' '+(l.by?.name||''))].join(' ').toLowerCase();
      return terms.every(t=>hay.includes(t));
    }).sort((a,b)=>b.createdAt-a.createdAt);
  }
  const hl=s=>{ let h=esc(s); terms.forEach(t=>{ if(!t)return; h=h.replace(new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),m=>`<mark>${m}</mark>`); }); return h; };
  return `<div class="sec-title">🔍 민원 검색 <small>"2층 화장실" 처럼 입력</small></div>
  <div class="search-box"><input id="s-q" value="${esc(searchQ)}" placeholder="장소·내용·담당자·처리내용 검색" oninput="searchQ=this.value;renderOnly('search')"></div>
  <div class="form-grid" style="margin-bottom:12px"><input type="date" value="${searchFrom}" onchange="searchFrom=this.value;render()" style="padding:10px;border:1.5px solid var(--gray3);border-radius:10px"><input type="date" value="${searchTo}" onchange="searchTo=this.value;render()" style="padding:10px;border:1.5px solid var(--gray3);border-radius:10px"></div>
  ${(terms.length||searchFrom||searchTo)?`<div style="font-size:13px;color:var(--gray5);margin-bottom:8px">${res.length}건</div>`:''}
  <div id="s-res">${res.map(i=>{ const lastDone=(i.logs||[]).filter(l=>l.type==='done').pop();
    return `<div class="issue s-${i.status}" onclick="openDetail('${i.id}')"><div class="i-head"><span class="badge b-${i.status}">${STATUS[i.status]}</span><span class="badge b-cat">${esc(i.category)}</span><span style="margin-left:auto;font-size:11.5px;color:var(--gray4)">${fmtDate(i.createdAt)}</span></div>
    <div class="i-title">${hl(i.title)}</div><div class="i-meta">${i.location?`<span>📍 ${hl(i.location)}</span>`:''}<span>접수 ${esc(i.reporter?.name)}</span></div>
    ${i.status==='done'?`<div class="i-foot" style="color:var(--green)">✔ ${fmtKo(i.doneAt)} ${esc(i.assignee?.name||'')} 완료${lastDone&&lastDone.text?' · '+hl(lastDone.text):''}</div>`:`<div class="i-foot">${assigneeLabel(i)}</div>`}</div>`; }).join('')||((terms.length||searchFrom||searchTo)?'<div class="empty">검색 결과가 없습니다</div>':'<div class="empty"><span class="big">🗂</span>예) "화장실 문", "누수", "김과장"<br><small>처리 과정의 댓글 내용까지 함께 검색됩니다</small></div>')}</div>`;
}
// 입력 중 포커스 유지용: 검색 결과 영역만 갱신
function renderOnly(t){ if(t==='search'){ const tmp=document.createElement('div'); tmp.innerHTML=renderSearch(); $('#s-res').innerHTML=tmp.querySelector('#s-res').innerHTML; const cnt=tmp.querySelector('.sec-title + .search-box + .form-grid + div'); } }

// ── 시작 ─────────────────────────────────────
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'){ if(sbOn) fetchAll().catch(console.warn); if(tab==='chat') lsSet(K.seenChat(),Date.now()); updateBadges(); } });
window.addEventListener('online',()=>{ if(sbOn) fetchAll().catch(console.warn); });
setInterval(()=>{ if(me && tab==='list') render(); },60000); // "n분 전" 갱신
initLogin();
</script>
